name: Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: App versionName, for example 0.0.1
        required: true
        type: string
      buildNumber:
        description: Android versionCode, must increase every release
        required: true
        type: string
      releaseNotes:
        description: Release notes shown in the app
        required: false
        type: string
      force:
        description: Mark this release as a forced update in latest.json
        required: true
        default: false
        type: boolean
      prerelease:
        description: Create as GitHub prerelease
        required: true
        default: false
        type: boolean
      releaseTag:
        description: Existing GitHub Release tag to upload assets into, for example v0.0.1
        required: false
        type: string

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.buildNumber }}
      RELEASE_NOTES: ${{ inputs.releaseNotes }}
      FORCE_UPDATE: ${{ inputs.force }}
      PRERELEASE: ${{ inputs.prerelease }}
      MANUAL_RELEASE_TAG: ${{ inputs.releaseTag }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.releaseTag || github.sha }}
          persist-credentials: false

      - name: Resolve release metadata
        run: |
          if [ -n "$MANUAL_RELEASE_TAG" ]; then
            RELEASE_TAG="$MANUAL_RELEASE_TAG"
            RELEASE_MODE=upload
          elif [ "$PRERELEASE" = "true" ]; then
            RELEASE_TAG="android-v${VERSION}+${BUILD_NUMBER}"
            RELEASE_MODE=create
          else
            RELEASE_TAG="v${VERSION}"
            RELEASE_MODE=create
          fi

          printf '%s\n' "${RELEASE_NOTES:-这个版本没有填写更新说明。}" > "$RUNNER_TEMP/release-notes.md"

          {
            echo "VERSION=$VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "FORCE_UPDATE=${FORCE_UPDATE:-false}"
            echo "PRERELEASE=${PRERELEASE:-false}"
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "RELEASE_MODE=$RELEASE_MODE"
          } >> "$GITHUB_ENV"

      - name: Validate release target
        run: |
          if [ "$RELEASE_MODE" = "upload" ]; then
            if [ "$RELEASE_TAG" != "v${VERSION}" ] && [ "$RELEASE_TAG" != "android-v${VERSION}+${BUILD_NUMBER}" ]; then
              echo "::error::releaseTag does not match version and buildNumber inputs."
              exit 1
            fi
            gh release view "$RELEASE_TAG" --json tagName --jq .tagName >/dev/null
            exit 0
          fi

          if [ "$PRERELEASE" != "true" ] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Stable releases must be dispatched from the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
             gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --silent >/dev/null 2>&1; then
            echo "::error::Tag or release $RELEASE_TAG already exists. Use releaseTag repair mode instead."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate signing secrets
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp app version
        run: node scripts/set-android-release-version.mjs "$VERSION" "$BUILD_NUMBER"

      - name: Verify committed release version
        if: env.RELEASE_MODE == 'create'
        run: |
          if ! git diff --quiet -- app.json package.json; then
            echo "::error::Version inputs must already be committed. Run the version script locally, commit app.json and package.json, then retry."
            git diff -- app.json package.json
            exit 1
          fi

      - name: Check project
        if: env.RELEASE_MODE == 'create'
        run: bun run check

      - name: Generate Android project
        run: bunx --bun expo prebuild --platform android --clean --no-install --non-interactive

      - name: Tune Gradle for CI
        run: |
          cat >> android/gradle.properties <<'EOF'

          # GitHub hosted runners are memory constrained during React Native release dexing.
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.caching=true
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
          EOF

      - name: Restore signing key
        run: |
          mkdir -p android/app/signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/signing/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Validate signing key can be opened
        run: |
          keytool -list \
            -keystore android/app/signing/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Android signing keystore and alias are readable."
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/signing/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Android failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-failure-reports
          if-no-files-found: ignore
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
            android/build/reports/

      - name: Prepare release assets
        run: |
          mkdir -p release
          APK_NAME="Inbox-${VERSION}-${BUILD_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"
          APK_SIZE="$(wc -c < "release/$APK_NAME" | tr -d ' ')"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"
          export APK_SIZE APK_URL
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const releaseNotesPath = path.join(process.env.RUNNER_TEMP, 'release-notes.md');
          const releaseNotes = fs.readFileSync(releaseNotesPath, 'utf8').trim()
            || '这个版本没有填写更新说明。';
          const payload = {
            version: process.env.VERSION,
            buildNumber: Number(process.env.BUILD_NUMBER),
            minSupportedBuild: 1,
            apkUrl: process.env.APK_URL,
            apkSize: Number(process.env.APK_SIZE),
            releaseNotes,
            force: process.env.FORCE_UPDATE === 'true',
            publishedAt: new Date().toISOString(),
            tagName: process.env.RELEASE_TAG,
            releaseUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/${process.env.RELEASE_TAG}`,
          };
          fs.writeFileSync('release/latest.json', `${JSON.stringify(payload, null, 2)}\n`);
          fs.writeFileSync('release/release-notes.md', payload.releaseNotes);
          NODE

      - name: Publish GitHub Release
        run: |
          if [ "$RELEASE_MODE" = "upload" ]; then
            gh release upload "$RELEASE_TAG" \
              "release/Inbox-${VERSION}-${BUILD_NUMBER}.apk" \
              "release/latest.json" \
              --clobber
          else
            FLAGS=()
            if [ "$PRERELEASE" = "true" ]; then
              FLAGS+=(--prerelease)
            else
              FLAGS+=(--latest)
            fi
            gh release create "$RELEASE_TAG" \
              "release/Inbox-${VERSION}-${BUILD_NUMBER}.apk" \
              "release/latest.json" \
              --target "$GITHUB_SHA" \
              --title "墨屿 Android ${VERSION} (${BUILD_NUMBER})" \
              --notes-file release/release-notes.md \
              "${FLAGS[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
