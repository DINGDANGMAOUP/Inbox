name: Android Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: App versionName, for example 0.0.1
        required: true
        type: string
      buildNumber:
        description: Android versionCode, must increase every internal build
        required: true
        type: string
      releaseNotes:
        description: Internal test notes shown in the app
        required: false
        type: string
      force:
        description: Mark this release as a forced update in latest.json
        required: true
        default: false
        type: boolean
      prerelease:
        description: Create as GitHub prerelease
        required: true
        default: true
        type: boolean
      releaseTag:
        description: Existing GitHub Release tag to upload assets into, for example v0.0.1
        required: false
        type: string

jobs:
  build-release-apk:
    name: Build and publish APK
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.buildNumber }}
      RELEASE_NOTES: ${{ inputs.releaseNotes }}
      FORCE_UPDATE: ${{ inputs.force }}
      PRERELEASE: ${{ inputs.prerelease }}
      MANUAL_RELEASE_TAG: ${{ inputs.releaseTag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            RELEASE_TAG="$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")"
            VERSION="${RELEASE_TAG#v}"
            BUILD_NUMBER="$GITHUB_RUN_NUMBER"
            RELEASE_NOTES="$(jq -r '.release.body // empty' "$GITHUB_EVENT_PATH")"
            FORCE_UPDATE=false
            PRERELEASE="$(jq -r '.release.prerelease' "$GITHUB_EVENT_PATH")"
            RELEASE_MODE=upload
          elif [ -n "$MANUAL_RELEASE_TAG" ]; then
            RELEASE_TAG="$MANUAL_RELEASE_TAG"
            RELEASE_MODE=upload
          else
            RELEASE_TAG="android-v${VERSION}+${BUILD_NUMBER}"
            RELEASE_MODE=create
          fi

          {
            echo "VERSION=$VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "FORCE_UPDATE=${FORCE_UPDATE:-false}"
            echo "PRERELEASE=${PRERELEASE:-true}"
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "RELEASE_MODE=$RELEASE_MODE"
            echo "RELEASE_NOTES<<EOF"
            echo "${RELEASE_NOTES:-这个版本没有填写更新说明。}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Validate signing secrets
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp app version
        run: node scripts/set-android-release-version.mjs "$VERSION" "$BUILD_NUMBER"

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install --non-interactive

      - name: Tune Gradle for CI
        run: |
          cat >> android/gradle.properties <<'EOF'

          # GitHub hosted runners are memory constrained during React Native release dexing.
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.caching=true
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
          EOF

      - name: Restore signing key
        run: |
          mkdir -p android/app/signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/signing/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Validate signing key can be opened
        run: |
          keytool -list \
            -keystore android/app/signing/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Android signing keystore and alias are readable."
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/signing/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Android failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-failure-reports
          if-no-files-found: ignore
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
            android/build/reports/

      - name: Prepare release assets
        run: |
          mkdir -p release
          APK_NAME="Inbox-${VERSION}-${BUILD_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"
          APK_SIZE="$(wc -c < "release/$APK_NAME" | tr -d ' ')"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"
          export APK_SIZE APK_URL
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = {
            version: process.env.VERSION,
            buildNumber: Number(process.env.BUILD_NUMBER),
            minSupportedBuild: 1,
            apkUrl: process.env.APK_URL,
            apkSize: Number(process.env.APK_SIZE),
            releaseNotes: process.env.RELEASE_NOTES || '这个内测版本没有填写更新说明。',
            force: process.env.FORCE_UPDATE === 'true',
            publishedAt: new Date().toISOString(),
            tagName: process.env.RELEASE_TAG,
            releaseUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/${process.env.RELEASE_TAG}`,
          };
          fs.writeFileSync('release/latest.json', `${JSON.stringify(payload, null, 2)}\n`);
          fs.writeFileSync('release/release-notes.md', payload.releaseNotes);
          NODE

      - name: Publish GitHub Release
        run: |
          if [ "$RELEASE_MODE" = "upload" ]; then
            gh release upload "$RELEASE_TAG" \
              "release/Inbox-${VERSION}-${BUILD_NUMBER}.apk" \
              "release/latest.json" \
              --clobber
          else
            FLAGS=()
            if [ "$PRERELEASE" = "true" ]; then
              FLAGS+=(--prerelease)
            else
              FLAGS+=(--latest)
            fi
            gh release create "$RELEASE_TAG" \
              "release/Inbox-${VERSION}-${BUILD_NUMBER}.apk" \
              "release/latest.json" \
              --title "墨屿 Android 内测 ${VERSION} (${BUILD_NUMBER})" \
              --notes-file release/release-notes.md \
              "${FLAGS[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
